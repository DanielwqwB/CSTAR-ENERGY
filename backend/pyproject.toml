[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cstar-energy-backend"
version = "0.1.0"
description = "Backend scaffold for the CSTAR-Energy environmental research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "geoalchemy2>=0.15,<1.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
  "redis>=5.0,<7.0",
  "rq>=1.16,<3.0",
]

[project.optional-dependencies]
science = [
  "numpy>=2.0",
  "pandas>=2.2",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.6",
  "scipy>=1.13",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app", "models", "schemas", "services", "ingestion", "processing", "analytics", "workers", "utils"]
